name: Build and Release do.it APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed do.it Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      DOIT_KEYSTORE_BASE64: ${{ secrets.DOIT_KEYSTORE_BASE64 }}
      DOIT_STORE_PASSWORD: ${{ secrets.DOIT_STORE_PASSWORD }}
      DOIT_KEY_ALIAS: ${{ secrets.DOIT_KEY_ALIAS }}
      DOIT_KEY_PASSWORD: ${{ secrets.DOIT_KEY_PASSWORD }}
      DOIT_KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets and decode keystore
        run: |
          test -n "$DOIT_KEYSTORE_BASE64" || { echo "Missing DOIT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$DOIT_STORE_PASSWORD" || { echo "Missing DOIT_STORE_PASSWORD secret"; exit 1; }
          test -n "$DOIT_KEY_ALIAS" || { echo "Missing DOIT_KEY_ALIAS secret"; exit 1; }
          test -n "$DOIT_KEY_PASSWORD" || { echo "Missing DOIT_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$DOIT_KEYSTORE_BASE64" | base64 --decode > "$DOIT_KEYSTORE_FILE"
          test -s "$DOIT_KEYSTORE_FILE"

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace || (echo "=== GRADLE BUILD FAILED ===" && exit 1)

      - name: Name APKs with app version
        id: apk
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME" || { echo "Could not read app versionName"; exit 1; }
          RELEASE_DIR="app/build/outputs/apk/release"
          DEBUG_DIR="app/build/outputs/apk/debug"
          RELEASE_APK="${RELEASE_DIR}/doit-v${VERSION_NAME}-release.apk"
          DEBUG_APK="${DEBUG_DIR}/doit-v${VERSION_NAME}-debug.apk"
          cp "${RELEASE_DIR}/app-release.apk" "$RELEASE_APK"
          cp "${DEBUG_DIR}/app-debug.apk" "$DEBUG_APK"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "debug_path=$DEBUG_APK" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksums
        run: |
          sha256sum "${{ steps.apk.outputs.release_path }}" > "${{ steps.apk.outputs.release_path }}.sha256"
          sha256sum "${{ steps.apk.outputs.debug_path }}" > "${{ steps.apk.outputs.debug_path }}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.apk.outputs.version }}
          VERSION_NAME: ${{ steps.apk.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## do.it v1.1.0 — Unicorn-grade MVP: dashboard, insight & widget

          - **Dashboard baru**:
            - Kartu hero saldo bulan ini (masuk, keluar, sisa) dengan angka animasi; grafik batang pengeluaran 7 hari terakhir dan 6 bulan terakhir; donut pengeluaran per kategori dengan legenda; cincin anggaran Belanja, Darurat, dan Tabungan dengan peringatan 80% (kuning) dan 100%+ (merah).
          - **Insight otomatis**:
            - Pengeluaran dibanding bulan lalu, kategori terbesar bulan ini, perkiraan sisa hari anggaran, dan proyeksi tanggal tercapai target tabungan — dihitung dari data lokal saja.
          - **Onboarding (sekali saat pertama buka)**:
            - Atur pemasukan bulanan, tiga anggaran (default 200rb/100rb/700rb), dan target laptop (default Rp3.000.000). Bisa dilewati dan diubah nanti di tab Anggaran.
          - **Quick add**:
            - Bottom sheet dengan keypad kalkulator, kategori terakhir dipakai sebagai default, dan baris kategori yang sering dipakai.
          - **Riwayat**:
            - Cari catatan (teks, kategori, jumlah), filter per kategori dan bulan, dan ubah catatan yang sudah ada (sebelumnya hanya bisa hapus).
          - **Target tabungan lebih dari satu**:
            - Laptop tetap target utama; tambah target sendiri (nama + target), tambah tabungan manual per target, ubah target, dan hapus target tambahan. Progres dan proyeksi per target.
          - **Widget layar utama**:
            - Sisa bulan ini, sisa anggaran, dan progres tabungan — ketuk widget untuk membuka aplikasi.
          - **Tetap ringan dan lokal**:
            - Grafik digambar sendiri dengan Canvas (tanpa library chart berat); semua data di HP (Room/SQLite); tanpa server, tanpa login, tanpa biaya.
          - **Catatan migrasi**:
            - Database naik ke versi 2 dengan target tabungan sebagai tabel baru. Data lama dihapus saat upgrade (fallbackToDestructiveMigration) karena aplikasi baru berumur satu hari.

          Published signed release and debug APKs.
          EOF
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            "${{ steps.apk.outputs.release_path }}" \
            "${{ steps.apk.outputs.release_path }}.sha256" \
            "${{ steps.apk.outputs.debug_path }}" \
            "${{ steps.apk.outputs.debug_path }}.sha256" \
            --title "do.it $RELEASE_TAG (Unicorn-grade MVP — dashboard, insights & widget)" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: doit-${{ steps.apk.outputs.version }}-APKs
          path: |
            ${{ steps.apk.outputs.release_path }}
            ${{ steps.apk.outputs.release_path }}.sha256
            ${{ steps.apk.outputs.debug_path }}
            ${{ steps.apk.outputs.debug_path }}.sha256
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f app/release.keystore
