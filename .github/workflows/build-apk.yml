name: Build and Release do.it APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Signed do.it Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      DOIT_KEYSTORE_BASE64: ${{ secrets.DOIT_KEYSTORE_BASE64 }}
      DOIT_STORE_PASSWORD: ${{ secrets.DOIT_STORE_PASSWORD }}
      DOIT_KEY_ALIAS: ${{ secrets.DOIT_KEY_ALIAS }}
      DOIT_KEY_PASSWORD: ${{ secrets.DOIT_KEY_PASSWORD }}
      DOIT_KEYSTORE_FILE: ${{ github.workspace }}/app/release.keystore

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Validate signing secrets and decode keystore
        run: |
          test -n "$DOIT_KEYSTORE_BASE64" || { echo "Missing DOIT_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$DOIT_STORE_PASSWORD" || { echo "Missing DOIT_STORE_PASSWORD secret"; exit 1; }
          test -n "$DOIT_KEY_ALIAS" || { echo "Missing DOIT_KEY_ALIAS secret"; exit 1; }
          test -n "$DOIT_KEY_PASSWORD" || { echo "Missing DOIT_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$DOIT_KEYSTORE_BASE64" | base64 --decode > "$DOIT_KEYSTORE_FILE"
          test -s "$DOIT_KEYSTORE_FILE"

      - name: Build Release and Debug APKs
        run: ./gradlew assembleRelease assembleDebug --stacktrace || (echo "=== GRADLE BUILD FAILED ===" && exit 1)

      - name: Name APKs with app version
        id: apk
        run: |
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$VERSION_NAME" || { echo "Could not read app versionName"; exit 1; }
          RELEASE_DIR="app/build/outputs/apk/release"
          DEBUG_DIR="app/build/outputs/apk/debug"
          RELEASE_APK="${RELEASE_DIR}/doit-v${VERSION_NAME}-release.apk"
          DEBUG_APK="${DEBUG_DIR}/doit-v${VERSION_NAME}-debug.apk"
          cp "${RELEASE_DIR}/app-release.apk" "$RELEASE_APK"
          cp "${DEBUG_DIR}/app-debug.apk" "$DEBUG_APK"
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "release_path=$RELEASE_APK" >> "$GITHUB_OUTPUT"
          echo "debug_path=$DEBUG_APK" >> "$GITHUB_OUTPUT"

      - name: Generate SHA-256 checksums
        run: |
          sha256sum "${{ steps.apk.outputs.release_path }}" > "${{ steps.apk.outputs.release_path }}.sha256"
          sha256sum "${{ steps.apk.outputs.debug_path }}" > "${{ steps.apk.outputs.debug_path }}.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.apk.outputs.version }}
          VERSION_NAME: ${{ steps.apk.outputs.version }}
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          ## do.it v1.4.0 — Desain baru ala app bank + Rp & Dollar

          - **Beranda ala app bank:**
            - Avatar profil paling kiri (ketuk → Profil & Pengaturan), sapaan "Halo, Adrien", total saldo besar dengan animasi, baris Masuk / Keluar / Sisa bulan ini, dan dua tombol besar **+ Pemasukan** (hijau) / **+ Pengeluaran** (merah) yang langsung membuka sheet dengan jenis yang benar.
            - Pemasukan universal — sumber tetap Gaji pokok, Lembur, Sampingan, Lain-lain, dan catatan opsional ada di pemasukan maupun pengeluaran.
          - **Dompet multi + 2 mata uang saja (Rp & Dollar):**
            - Tiap dompet punya mata uang (Rp atau $); dompet lama default Rp. Ringkasan per mata uang: Tunai · E-money · Bank tidak dicampur antar mata uang.
            - Transfer antar dompet menampilkan arah eksplisit ("Tunai → GoPay"); transfer Rp ↔ $ tanpa kurs otomatis — jumlah yang diterima diisi manual.
          - **Paylater & Utang Piutang (bagian khusus di Rencana):**
            - Utang/piutang punya jenis: Utang / Piutang / Paylater, plus nama penyedia untuk Paylater (mis. GoPay Later, SPayLater). Paylater otomatis berarti kamu meminjam.
          - **Profil & Pengaturan (baru, dari avatar Beranda):**
            - Nama tampilan, mata uang utama (Rp/$), dompet utama, pemasukan bulanan, jalan pintas ke Rencana/Laporan, versi aplikasi + cek update (self-update yang sama). Tanpa login, tanpa foto — avatar inisial.
          - **Migrasi aman ke database v4 (migrasi nyata v3→v4):**
            - Dompet lama dapat kolom mata uang (default IDR), utang lama dapat jenis + penyedia — semua data dipertahankan, tanpa penghapusan.
          - **Batas yang disengaja:**
            - Anggaran, target tabungan, tagihan, dan utang tetap dalam Rp. Kalau mata uang utama diganti ke Dollar, ringkasan memakai $, tetapi anggaran yang sudah diset tetap dibandingkan dalam Rp — set ulang anggaran setelah pindah mata uang kalau perlu.
            - Jumlah Dollar ditampilkan tanpa sen (angka bulat).

          Published signed release and debug APKs.
          EOF
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            "${{ steps.apk.outputs.release_path }}" \
            "${{ steps.apk.outputs.release_path }}.sha256" \
            "${{ steps.apk.outputs.debug_path }}" \
            "${{ steps.apk.outputs.debug_path }}.sha256" \
            --title "do.it $RELEASE_TAG (Desain bank — Beranda baru, Rp & Dollar, Paylater & Profil)" \
            --notes-file RELEASE_NOTES.md \
            --latest

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: doit-${{ steps.apk.outputs.version }}-APKs
          path: |
            ${{ steps.apk.outputs.release_path }}
            ${{ steps.apk.outputs.release_path }}.sha256
            ${{ steps.apk.outputs.debug_path }}
            ${{ steps.apk.outputs.debug_path }}.sha256
          retention-days: 30

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f app/release.keystore
